[Object Search window resolution]
; Resolução da janela de busca (deve ser igual ao tamanho do modelo)
detection_window_width = 320
detection_window_height = 320

[Aim settings]
; Ajuste vertical para mirar no peito/pescoço se a cabeça não for detectada
body_y_offset = 0.35
disable_headshot = False
aim_point = chest

[Hot keys]
; Botão do mouse que ativa a trava (0x02 = Botão Direito)
Right mouse button = rbutton
auto_aim_key = Right mouse
F2 = f2
F3 = f3

[Mouse settings]
; Suavização da mira (menor = mais rápido/agressivo, maior = mais humano)
mouse_smoothing = 0.40
humanizer_speed = 2000
mouse_auto_aim = True
mouse_native = True

[Overlay settings]
show_fov = True
fov_color = #32D7A0
overlay_opacity = 85

[AI options]
AI_model_path = models/BioSync-Warzone.onnx
AI_image_size = 320
AI_conf = 0.55
AI_iou = 0.45
AI_max_det = 5
target_classes = Enemy,character,exoai,player,bot,head

[Views]
esp_enabled = False
esp_style = Normal
esp_thickness = 2
esp_color = #FF3030
esp_opacity = 45
distance_filter = False
min_distance = 0.0
max_distance = 1.0
ignore_small_targets = False
min_box_area = 0.002
ignore_large_targets = False
max_box_area = 0.8
snap_line = False
snap_line_color = #32D7A0
snap_line_thickness = 2
show_aim_marker = True
marker_color = #FF3030
show_body_zones = False
head_color = #F06464
chest_color = #32C7D7
belly_color = #F2C94C

[Cv2 debug window settings]
; Deixe True inicialmente apenas para testar se a IA está detectando os alvos
show_window = True
show_fps = True
show_boxes = True
debug_window_name = ( BioSync | AI ) - Calibrator
